name: mongo-sharding

services:
  configSrv:
    image: mongo:8.0
    command: mongod --configsvr --replSet config_server --bind_ip_all --port 27019
    volumes:
      - config-data:/data/db
    healthcheck:
      test: mongosh --port 27019 --quiet --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 10

  shard1:
    image: mongo:8.0
    command: mongod --shardsvr --replSet shard1 --bind_ip_all --port 27018
    volumes:
      - shard1-data:/data/db
    healthcheck:
      test: mongosh --port 27018 --quiet --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 10

  shard2:
    image: mongo:8.0
    command: mongod --shardsvr --replSet shard2 --bind_ip_all --port 27018
    volumes:
      - shard2-data:/data/db
    healthcheck:
      test: mongosh --port 27018 --quiet --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 10

  mongos_router:
    image: mongo:8.0
    command: mongos --configdb config_server/configSrv:27019 --bind_ip_all --port 27017
    depends_on:
      configSrv:
        condition: service_healthy
      shard1:
        condition: service_healthy
      shard2:
        condition: service_healthy
    healthcheck:
      test: mongosh --port 27017 --quiet --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 10

  pymongo_api:
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      mongos_router:
        condition: service_started
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27017"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  config-data:
  shard1-data:
  shard2-data:
